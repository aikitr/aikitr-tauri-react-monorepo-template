packages:
  - "apps/*"
  - "packages/*"

# pnpm 9+ catalog：统一 workspace 内第三方依赖版本
# 各包在 dependencies 中写 "catalog:" 即可引用此处定义的版本，避免版本漂移
catalog:
  "@base-ui/react": "^1.8.0"
  tw-animate-css: "^1.4.0"
  react: "^19.3.0"
  "react-dom": "^19.3.0"
  "@tauri-apps/api": "^2.12.1"
  "@tauri-apps/plugin-opener": "^2.7.0"
  "@tauri-apps/plugin-dialog": "^2.8.1"
  "@tauri-apps/plugin-fs": "^2.6.0"
  "@tauri-apps/plugin-shell": "^2.4.0"
  zustand: "^5.0.15"
  "@tanstack/react-query": "^5.104.1"
  zod: "^4.6.5"
  cn: "^0.4.0"
  class-variance-authority: "^0.7.1"
  "lucide-react": "^1.51.0"
  typescript: "^7.0.2"
  vite: "^8.3.2"
  tailwindcss: "^4.3.3"
  "@tailwindcss/vite": "^4.3.3"
  "@vitejs/plugin-react": "^6.1.1"
  vitest: "^5.0.3"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  eslint: "^10.12.0"
  prettier: "^3.9.9"

# 构建脚本白名单（pnpm 默认拒绝第三方包执行 postinstall 等脚本）
allowBuilds:
  esbuild: true
  "@tauri-apps/cli": true

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.7"
  - "@turbo/darwin-arm64@2.11.7"
  - "@turbo/linux-64@2.11.7"
  - "@turbo/linux-arm64@2.11.7"
  - "@turbo/windows-64@2.11.7"
  - "@turbo/windows-arm64@2.11.7"
  - lucide-react@1.51.0
  - turbo@2.11.7
  - eslint@10.12.0
