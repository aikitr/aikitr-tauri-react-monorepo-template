[package]
name = "aikitr-desktop"
version = "0.1.0"
description = "Enterprise-grade cross-platform desktop application"
authors = ["aikitr"]
edition = "2021"
rust-version = "1.77"

# Tauri v2 推荐 lib + bin 分离结构
# lib 负责所有业务逻辑，bin 仅调用 lib::run()
[lib]
name = "aikitr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

# 发布构建优化
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
